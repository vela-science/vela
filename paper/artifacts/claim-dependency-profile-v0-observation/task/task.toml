schema_version = "1.3"

[task]
name = "vela/claim-dependency-observation-{{ARM}}"
description = "Matched read-only claim-dependency interpretation pilot."
authors = [{ name = "Vela" }]
keywords = ["vela", "read-only", "claim-dependency", "instrumentation"]

[agent]
timeout_sec = 900.0
user = "participant"
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "chatgpt.com", "*.chatgpt.com", "auth.openai.com", "*.auth.openai.com"]

[verifier]
timeout_sec = 60.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
os = "linux"
cpus = 1
memory_mb = 512
storage_mb = 1024

[environment]
network_mode = "no-network"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 8192
build_timeout_sec = 900.0
workdir = "/workspace"

[metadata]
experiment_id = "synthetic-counterfactual-erdos-321-v0"
arm = "{{ARM}}"
authority_effect = "none"
claim_credit = false
