[package]
name = "vela-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core library for the Vela scientific knowledge protocol: replayable frontier state, signed canonical events, and proof packets."
readme = "../../README.md"
keywords = ["science", "frontier", "protocol", "ed25519", "replay"]
categories = ["science", "data-structures", "cryptography"]
publish = false

[lib]
name = "vela_protocol"
path = "src/lib.rs"

# The product CLI lives in `crates/vela-cli`; this crate remains the reusable
# protocol kernel without application command handling.

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
schemars.workspace = true
toml.workspace = true
sha2.workspace = true
chrono.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
rand_core.workspace = true
regex.workspace = true
tempfile.workspace = true
vela-verify.workspace = true
serde_yaml_ng.workspace = true

[lints]
workspace = true
