<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Vela scientific-state flow</title>
  <desc id="desc">Native work becomes a Submission and pending Proposal. A scoped Verification informs an authorized Decision. Replay derives current Standing while corrections retain the earlier Claim.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f4e8"/>
      <stop offset="1" stop-color="#eef3f6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315f82"/>
    </marker>
    <style>
      .label { font: 600 18px ui-sans-serif, system-ui, sans-serif; fill: #132637; }
      .detail { font: 14px ui-sans-serif, system-ui, sans-serif; fill: #526577; }
      .node { fill: #fffdf7; stroke: #8ba0ae; stroke-width: 1.5; }
      .authority { fill: #173a59; stroke: #173a59; }
      .authority-label { font: 600 18px ui-sans-serif, system-ui, sans-serif; fill: #fffdf7; }
      .authority-detail { font: 14px ui-sans-serif, system-ui, sans-serif; fill: #dce9f0; }
      .line { fill: none; stroke: #315f82; stroke-width: 2.5; marker-end: url(#arrow); }
      .check { fill: none; stroke: #b85d3e; stroke-width: 2; marker-end: url(#arrow); }
      .correction { fill: none; stroke: #b85d3e; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#sea)"/>
  <path d="M 45 292 C 230 248, 398 320, 575 278 S 925 230, 1155 286" fill="none" stroke="#c9d9df" stroke-width="2"/>
  <path d="M 45 309 C 260 274, 398 342, 610 300 S 951 264, 1155 313" fill="none" stroke="#dbe5e8" stroke-width="1.5"/>

  <rect class="node" x="45" y="104" width="185" height="94" rx="12"/>
  <text class="label" x="68" y="140">Native work</text>
  <text class="detail" x="68" y="166">proof, computation,</text>
  <text class="detail" x="68" y="186">experiment, review</text>

  <path class="line" d="M 230 151 L 287 151"/>

  <rect class="node" x="290" y="104" width="190" height="94" rx="12"/>
  <text class="label" x="313" y="140">Submission</text>
  <text class="detail" x="313" y="166">bounded Result and</text>
  <text class="detail" x="313" y="186">exact evidence</text>

  <path class="line" d="M 480 151 L 537 151"/>

  <rect class="node" x="540" y="104" width="190" height="94" rx="12"/>
  <text class="label" x="563" y="140">Proposal</text>
  <text class="detail" x="563" y="166">pending scientific</text>
  <text class="detail" x="563" y="186">state change</text>

  <rect class="node" x="540" y="246" width="190" height="72" rx="12"/>
  <text class="label" x="563" y="277">Scoped check</text>
  <text class="detail" x="563" y="300">never acceptance</text>
  <path class="check" d="M 635 246 L 635 202"/>

  <path class="line" d="M 730 151 L 787 151"/>

  <rect class="authority" x="790" y="104" width="190" height="94" rx="12"/>
  <text class="authority-label" x="813" y="140">Decision</text>
  <text class="authority-detail" x="813" y="166">authorized and</text>
  <text class="authority-detail" x="813" y="186">attributed</text>

  <path class="line" d="M 980 151 L 1037 151"/>

  <rect class="node" x="1040" y="104" width="120" height="94" rx="12"/>
  <text class="label" x="1063" y="140">Standing</text>
  <text class="detail" x="1063" y="166">derived by</text>
  <text class="detail" x="1063" y="186">replay</text>

  <path class="correction" d="M 1100 210 C 1100 332, 385 338, 385 211"/>
  <text class="detail" x="765" y="332">corrections retain predecessors</text>
</svg>
