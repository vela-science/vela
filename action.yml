# vela-check — strictly verify one clean Git-native Vela frontier.
#
# Consume from a frontier repository:
#
#   - uses: actions/checkout@v5
#   - uses: vela-science/vela@v0.950.1
#     with:
#       frontier: .
#       vela-version: v0.950.1
#
# Current repositories carry one signed repository origin and authority
# initialization record. The action verifies that closed boundary directly
# with the pinned released binary. It never installs trust state, signs,
# decides, or changes Frontier state.

name: vela-check
description: Strictly verifies one clean current Git-native Vela Frontier.

inputs:
  frontier:
    description: Path to the frontier directory within the consumer repo.
    required: false
    default: "."
  vela-version:
    description: >-
      Required reviewed Vela release tag (e.g. v0.950.1). The consumer chooses
      this pin; proposed Frontier bytes cannot select or downgrade the verifier.
    required: true

runs:
  using: composite
  steps:
    - name: Install vela (pinned release binary, no from-source build)
      shell: bash
      env:
        VELA_VERSION_INPUT: ${{ inputs.vela-version }}
        FRONTIER: ${{ inputs.frontier }}
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        requested="${VELA_VERSION_INPUT#v}"
        if [ -z "$requested" ]; then
          echo "::error::vela-version is required; proposed Frontier bytes cannot select the verifier"
          exit 1
        fi
        if ! printf '%s' "$requested" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::vela-version must be one stable exact release"
          exit 1
        fi
        release="v$requested"
        install_root="${RUNNER_TEMP:?}/vela-action-$requested"
        policy_root="$install_root/share/polkit-1/actions"
        # install.sh ships with this exact action tag. It fetches the platform
        # asset from the matching GitHub release and verifies its SHA-256.
        if [ -f "$ACTION_PATH/install.sh" ]; then
          VELA_VERSION="$release" \
            VELA_INSTALL_PREFIX="$install_root" \
            VELA_POLKIT_POLICY_DIR="$policy_root" \
            bash "$ACTION_PATH/install.sh"
        else
          curl -fsSL "https://raw.githubusercontent.com/vela-science/vela/$release/install.sh" \
            | VELA_VERSION="$release" \
                VELA_INSTALL_PREFIX="$install_root" \
                VELA_POLKIT_POLICY_DIR="$policy_root" \
                bash
        fi
        version_output="$("$install_root/bin/vela" --version)"
        installed="${version_output##* }"
        installed="${installed#v}"
        if [ "$installed" != "$requested" ]; then
          echo "::error::installed Vela $installed does not match requested Vela $requested"
          exit 1
        fi
        echo "$version_output (matches the consumer pin)"

    - name: Strict read-only repository verification
      shell: bash
      env:
        FRONTIER: ${{ inputs.frontier }}
        VELA_VERSION_INPUT: ${{ inputs.vela-version }}
      run: |
        set -euo pipefail
        requested="${VELA_VERSION_INPUT#v}"
        vela_bin="${RUNNER_TEMP:?}/vela-action-$requested/bin/vela"
        if ! "$vela_bin" check "$FRONTIER" --strict; then
          echo "::error::strict Vela verification failed; replay, repository context, signatures, committed projections, or trust debt is blocking"
          exit 1
        fi
        echo "strict verification OK — exact repository and scientific-state roots reproduce"
