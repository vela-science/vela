name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.asset }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: vela-linux-x86_64.tar.gz
          - runner: macos-15
            asset: vela-macos-aarch64.zip
          - runner: windows-2025
            asset: vela-windows-x86_64.zip
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-19
      - name: Require the tag to match every Vela workspace package
        shell: bash
        run: |
          package_version() {
            local package_id
            package_id="$(cargo pkgid --locked -p "$1")"
            printf '%s' "${package_id##*@}"
          }
          version="$(package_version vela-cli)"
          for package in vela-edge vela-hub vela-protocol vela-protocol-core vela-signer vela-verify; do
            observed="$(package_version "$package")"
            test "$observed" = "$version" || {
              echo "Vela workspace version mismatch: vela-cli=$version, $package=$observed" >&2
              exit 1
            }
          done
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "release tag $GITHUB_REF_NAME does not match Vela workspace version v$version" >&2
            exit 1
          }
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Test signer contracts and platform profile
        run: cargo test --locked -p vela-signer
      - name: Build release binaries
        run: cargo build --locked --release -p vela-cli --bins
      - name: Require macOS public-beta signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for name in DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            test -n "${!name}" || { echo "missing required macOS release credential: $name" >&2; exit 1; }
          done
      - name: Developer-ID sign macOS binaries
        if: runner.os == 'macOS'
        shell: bash
        env:
          DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/vela-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" target/release/vela target/release/vela-signer
          codesign --verify --strict --verbose=2 target/release/vela target/release/vela-signer
          rm -f "$RUNNER_TEMP/developer-id.p12"
      - name: Require Windows public-beta signing credentials
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AUTHENTICODE_PFX: ${{ secrets.WINDOWS_AUTHENTICODE_PFX }}
          AUTHENTICODE_PFX_PASSWORD: ${{ secrets.WINDOWS_AUTHENTICODE_PFX_PASSWORD }}
        run: |
          if (-not $env:AUTHENTICODE_PFX -or -not $env:AUTHENTICODE_PFX_PASSWORD) {
            throw "Windows public-beta release requires WINDOWS_AUTHENTICODE_PFX and WINDOWS_AUTHENTICODE_PFX_PASSWORD"
          }
      - name: Authenticode-sign and timestamp Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AUTHENTICODE_PFX: ${{ secrets.WINDOWS_AUTHENTICODE_PFX }}
          AUTHENTICODE_PFX_PASSWORD: ${{ secrets.WINDOWS_AUTHENTICODE_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "vela-authenticode.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:AUTHENTICODE_PFX))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object FullName -Match '\\x64\\signtool.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1).FullName
          if (-not $signtool) { throw "SignTool x64 not found" }
          foreach ($binary in @("target/release/vela.exe", "target/release/vela-signer.exe")) {
            & $signtool sign /f $pfx /p $env:AUTHENTICODE_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $binary
            & $signtool verify /pa /v $binary
          }
          Remove-Item -Force $pfx
      - name: Check exact fixture-signature state
        if: runner.os == 'Linux'
        run: cargo test --locked -p vela-protocol --test fixture_manifest_signature
      - name: Stage Unix bundle
        if: runner.os != 'Windows'
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p dist stage
          cp target/release/vela target/release/vela-signer stage/
          if [ "$RUNNER_OS" = "Linux" ]; then
            mkdir -p stage/share/polkit-1/actions
            cp packaging/linux/science.vela.signer.policy stage/share/polkit-1/actions/
          fi
      - name: Stage Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, stage | Out-Null
          Copy-Item target/release/vela.exe, target/release/vela-signer.exe stage/
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: stage
          format: spdx-json
          output-file: dist/${{ matrix.asset }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Prepare Linux archive
        if: runner.os == 'Linux'
        env:
          ASSET: ${{ matrix.asset }}
        run: tar -C stage -czf "dist/$ASSET" .
      - name: Prepare and notarize macOS archive
        if: runner.os == 'macOS'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --norsrc stage/ "dist/$ASSET"
          xcrun notarytool submit "dist/$ASSET" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          spctl --assess --type execute --verbose=2 target/release/vela
          spctl --assess --type execute --verbose=2 target/release/vela-signer
      - name: Prepare Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          Compress-Archive -Path stage/vela.exe, stage/vela-signer.exe -DestinationPath "dist/$env:ASSET"
      - name: Write archive and SBOM checksums
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          cd dist
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          shasum -a 256 "$ASSET.spdx.json" > "$ASSET.spdx.json.sha256"
      - name: Attest archive and SBOM provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in \
            vela-linux-x86_64.tar.gz \
            vela-macos-aarch64.zip \
            vela-windows-x86_64.zip
          do
            test -f "dist/$asset"
            test -f "dist/$asset.sha256"
            test -f "dist/$asset.spdx.json"
            test -f "dist/$asset.spdx.json.sha256"
          done
          release_flags=(
            --verify-tag
            --title "$GITHUB_REF_NAME"
            --notes-from-tag
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${release_flags[@]}"
