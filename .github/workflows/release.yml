name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - id: version
        name: Bind release identity
        shell: bash
        run: |
          version="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as source:
              print(tomllib.load(source)["workspace"]["package"]["version"])
          PY
          )"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "v$version" = "$GITHUB_REF_NAME"
          else
            test "$GITHUB_REF" = refs/heads/main
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    name: build-${{ matrix.asset }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: vela-linux-x86_64.tar.gz
          - runner: macos-15
            asset: vela-macos-aarch64.zip
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-19
        with:
          toolchain: "1.97.1"
      - name: Build auditable release binary
        shell: bash
        run: |
          cargo install cargo-auditable --version 0.7.5 --locked
          cargo auditable build --locked --release -p vela-cli --bin vela
      - name: Stage binary
        run: mkdir -p dist stage && cp target/release/vela stage/
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: stage
          format: spdx-json
          output-file: dist/${{ matrix.asset }}.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false
      - name: Verify SBOM includes Vela
        shell: bash
        run: |
          python_bin=python3
          command -v "$python_bin" >/dev/null 2>&1 || python_bin=python
          "$python_bin" .github/release/check-sbom.py "dist/${{ matrix.asset }}.spdx.json"
      - name: Archive Linux bundle
        if: runner.os == 'Linux'
        run: tar -C stage -czf "dist/${{ matrix.asset }}" .
      - name: Archive macOS bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --norsrc stage/ "dist/${{ matrix.asset }}"
      - name: Write checksums
        shell: bash
        run: |
          cd dist
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          shasum -a 256 "${{ matrix.asset }}.spdx.json" > "${{ matrix.asset }}.spdx.json.sha256"
      - name: Attest archive and SBOM
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  smoke:
    needs: [metadata, build]
    name: smoke-${{ matrix.asset }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: vela-linux-x86_64.tar.gz
          - runner: macos-15
            asset: vela-macos-aarch64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist
      - name: Smoke release bundle
        run: .github/release/smoke-bundle.sh "dist/${{ matrix.asset }}" "${{ needs.metadata.outputs.version }}"

  publish:
    if: github.event_name == 'push'
    needs: [metadata, build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in vela-linux-x86_64.tar.gz vela-macos-aarch64.zip; do
            test -f "dist/$asset"
            test -f "dist/$asset.sha256"
            test -f "dist/$asset.spdx.json"
            test -f "dist/$asset.spdx.json.sha256"
          done
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${release_flags[@]}" --verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag
