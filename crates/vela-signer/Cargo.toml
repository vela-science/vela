[package]
name = "vela-signer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "One-shot local decision signer for Vela human authority events."
publish = true

[lib]
name = "vela_signer"
path = "src/lib.rs"

[dependencies]
vela-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
zeroize = { workspace = true }
clap = { workspace = true }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rand = { workspace = true }
same-file = "1.0.6"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_Console", "Win32_System_WinRT"] }
windows-future = "0.3.2"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
