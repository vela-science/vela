# The independent witness mirror (vela-hub-witness.fly.dev).
#
# This is the hub the primary cannot lie to: its OWN SQLite store on its
# own volume, its OWN signing key, its own ingest loop re-deriving every
# frontier from the same git remotes. It shares nothing with the primary
# but the protocol — which is exactly what makes `vela hub witness-check`
# (cross-hub canonical-byte agreement, THREAT_MODEL A11) worth running.
# The retired fly.hub-2/fly.hub-eu configs shared the primary's Postgres:
# witnesses that cannot disagree prove nothing.
#
# Bring-up:
#   flyctl apps create vela-hub-witness
#   flyctl volumes create hub_data --app vela-hub-witness --region ord --size 3
#   flyctl secrets set --app vela-hub-witness VELA_HUB_SIGNING_KEY=<its own hex key>
#   flyctl deploy --config crates/vela-hub/fly.hub-witness.toml
#   scripts/seed-witness.sh   # replay the owner-signed registrations
app = "vela-hub-witness"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"

[mounts]
  source = "hub_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "8s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

  [[http_service.checks]]
    interval = "15s"
    timeout = "8s"
    grace_period = "5s"
    method = "GET"
    path = "/readyz"

[env]
  VELA_HUB_DATABASE_URL = "sqlite:///data/hub.db"
  VELA_HUB_GIT_INGEST_INTERVAL_SECS = "300"
  VELA_HUB_GIT_INGEST_DIR = "/data/git-ingest"
  VELA_HUB_PEERS = "https://hub.constellate.science"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
