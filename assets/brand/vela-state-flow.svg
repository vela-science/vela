<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">How Vela state moves</title>
  <desc id="desc">Evidence moves through a work offer, artifact, exact verifier, and Receipt. A signed policy either permits an exact class or defers to a protected human decision.</desc>
  <rect width="1280" height="560" rx="28" fill="#081224"/>
  <path d="M0 425C222 350 405 476 641 389C890 297 1048 347 1280 236V560H0V425Z" fill="#111827"/>

  <g transform="translate(52 38) scale(.105)">
    <path fill="#F7F6F2" d="M80 650 C300 646 560 610 800 82 C742 286 638 506 520 650 Z"/>
    <path fill="#F7F6F2" d="M520 650 C628 590 724 392 800 82 C770 322 734 516 690 650 Z"/>
    <path stroke="#F7F6F2" stroke-linecap="round" stroke-width="12" d="M818 116 L818 650"/>
    <path stroke="#C9A664" stroke-linecap="round" stroke-width="12" d="M65 657 C320 651 585 623 915 670"/>
  </g>
  <text x="160" y="80" fill="#F7F6F2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="4">EVIDENCE → DIRECTION</text>
  <text x="52" y="132" fill="#C9A664" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" font-weight="600" letter-spacing="3">MECHANICAL EVIDENCE LANE</text>

  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <g transform="translate(52 170)">
      <rect width="176" height="104" rx="15" fill="#111827" stroke="#344258"/>
      <text x="20" y="38" fill="#8F9BAE" font-family="IBM Plex Mono, Menlo, monospace" font-size="13">01 · OFFER</text>
      <text x="20" y="70" fill="#F7F6F2" font-size="19" font-weight="650">Bounded work</text>
      <text x="20" y="91" fill="#AAB5C6" font-size="12">packet + roots</text>
    </g>
    <path d="M236 222H261" stroke="#C9A664" stroke-width="2"/>
    <path d="M254 216L262 222L254 228" stroke="#C9A664" stroke-width="2" fill="none"/>

    <g transform="translate(270 170)">
      <rect width="176" height="104" rx="15" fill="#111827" stroke="#344258"/>
      <text x="20" y="38" fill="#8F9BAE" font-family="IBM Plex Mono, Menlo, monospace" font-size="13">02 · ARTIFACT</text>
      <text x="20" y="70" fill="#F7F6F2" font-size="19" font-weight="650">Frozen bytes</text>
      <text x="20" y="91" fill="#AAB5C6" font-size="12">content addressed</text>
    </g>
    <path d="M454 222H479" stroke="#C9A664" stroke-width="2"/>
    <path d="M472 216L480 222L472 228" stroke="#C9A664" stroke-width="2" fill="none"/>

    <g transform="translate(488 170)">
      <rect width="176" height="104" rx="15" fill="#111827" stroke="#4F8F8B"/>
      <text x="20" y="38" fill="#4F8F8B" font-family="IBM Plex Mono, Menlo, monospace" font-size="13">03 · VERIFY</text>
      <text x="20" y="70" fill="#F7F6F2" font-size="19" font-weight="650">Exact check</text>
      <text x="20" y="91" fill="#AAB5C6" font-size="12">scoped result</text>
    </g>
    <path d="M672 222H697" stroke="#C9A664" stroke-width="2"/>
    <path d="M690 216L698 222L690 228" stroke="#C9A664" stroke-width="2" fill="none"/>

    <g transform="translate(706 170)">
      <rect width="176" height="104" rx="15" fill="#111827" stroke="#344258"/>
      <text x="20" y="38" fill="#8F9BAE" font-family="IBM Plex Mono, Menlo, monospace" font-size="13">04 · RECEIPT</text>
      <text x="20" y="70" fill="#F7F6F2" font-size="19" font-weight="650">Provenance</text>
      <text x="20" y="91" fill="#AAB5C6" font-size="12">producer ≠ verdict</text>
    </g>

    <path d="M890 222H926" stroke="#C9A664" stroke-width="2"/>
    <path d="M919 216L927 222L919 228" stroke="#C9A664" stroke-width="2" fill="none"/>
    <path d="M975 176L1024 222L975 268L926 222L975 176Z" fill="#111827" stroke="#C9A664"/>
    <text x="948" y="216" fill="#F7F6F2" font-size="14" font-weight="650">signed</text>
    <text x="950" y="235" fill="#F7F6F2" font-size="14" font-weight="650">policy</text>

    <path d="M1024 204H1073" stroke="#6E9F77" stroke-width="2"/>
    <path d="M1066 198L1074 204L1066 210" stroke="#6E9F77" stroke-width="2" fill="none"/>
    <text x="1030" y="189" fill="#6E9F77" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">PERMIT</text>
    <g transform="translate(1082 158)">
      <rect width="146" height="92" rx="15" fill="#13251F" stroke="#6E9F77"/>
      <text x="18" y="39" fill="#F7F6F2" font-size="18" font-weight="650">Accepted</text>
      <text x="18" y="64" fill="#AFC9B5" font-size="12">exact allowed class</text>
    </g>

    <path d="M975 268V333" stroke="#B7832F" stroke-width="2"/>
    <path d="M969 326L975 334L981 326" stroke="#B7832F" stroke-width="2" fill="none"/>
    <text x="986" y="303" fill="#B7832F" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">DEFER</text>
  </g>

  <text x="52" y="342" fill="#B7832F" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" font-weight="600" letter-spacing="3">EXPLICIT AUTHORITY LANE</text>
  <g transform="translate(886 352)" font-family="Inter, Helvetica, Arial, sans-serif">
    <rect width="178" height="94" rx="15" fill="#1A1B22" stroke="#B7832F"/>
    <text x="20" y="40" fill="#F7F6F2" font-size="18" font-weight="650">Protected review</text>
    <text x="20" y="66" fill="#C7B68F" font-size="12">one exact decision</text>
    <path d="M186 47H211" stroke="#C9A664" stroke-width="2"/>
    <path d="M204 41L212 47L204 53" stroke="#C9A664" stroke-width="2" fill="none"/>
    <rect x="220" width="122" height="94" rx="15" fill="#111827" stroke="#C9A664"/>
    <text x="242" y="40" fill="#F7F6F2" font-size="18" font-weight="650">Signed</text>
    <text x="242" y="64" fill="#AAB5C6" font-size="12">accept / reject</text>
  </g>

  <circle cx="60" cy="408" r="8" fill="#4F8F8B"/>
  <text x="82" y="414" fill="#D6DCE5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16">Verifier success is evidence, not scientific acceptance.</text>
  <text x="52" y="504" fill="#7F8CA0" font-family="IBM Plex Mono, Menlo, monospace" font-size="13">Git history is custody · exact roots are identity · the website is read only · no model belongs in the signing path</text>
</svg>
