# vela-check — strictly verify one clean Git-native Vela frontier.
#
# Consume from a frontier repository:
#
#   - uses: actions/checkout@v5
#   - uses: vela-science/vela@v0.914.1
#     with:
#       frontier: .
#       vela-version: v0.914.1
#       repository-boundary-root: ${{ vars.VELA_REPOSITORY_BOUNDARY_ROOT }}
#
# For an administrator-bound Profile v1 repository, the first boundary root
# must come from protected GitHub repository or organization configuration,
# never from the proposed checkout. The action installs that public consumer
# pin in the ephemeral runner account and runs the strict read-only verifier.
# It never materializes, signs, or changes scientific state.

name: vela-check
description: >-
  Strictly verifies a clean Git-native Vela frontier with an optional exact
  out-of-band repository-boundary pin.

inputs:
  frontier:
    description: Path to the frontier directory within the consumer repo.
    required: false
    default: "."
  vela-version:
    description: >-
      Required reviewed Vela release tag (e.g. v0.914.1). It must match the
      `vela_version` recorded in the frontier's vela.lock, preventing the
      proposed frontier bytes from selecting an older verifier.
    required: true
  repository-boundary-root:
    description: >-
      Full sha256 content root of the first administrator boundary. Required
      for an administrator-bound Profile v1 frontier. Supply it from a
      protected GitHub repository or organization variable, not from a file in
      the proposed checkout. Omit it when the runner already has the exact pin,
      or for legacy or structural-genesis repositories with no administrator
      boundary.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install vela (pinned release binary, no from-source build)
      shell: bash
      env:
        VELA_VERSION_INPUT: ${{ inputs.vela-version }}
        FRONTIER: ${{ inputs.frontier }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        lock="$FRONTIER/vela.lock"
        if [ ! -f "$lock" ]; then
          echo "::error::$lock not found — cannot select the lock-matching Vela release"
          exit 1
        fi
        lock_version="$(awk '/^vela_version:/{print $2}' "$lock")"
        lock_version="${lock_version#v}"
        if [ -z "$lock_version" ]; then
          echo "::error::$lock has no vela_version — regenerate it with a pinned Vela release"
          exit 1
        fi
        requested="${VELA_VERSION_INPUT#v}"
        if [ -z "$requested" ]; then
          echo "::error::vela-version is required; proposed lock bytes cannot select the verifier"
          exit 1
        fi
        if [ "$requested" != "$lock_version" ]; then
          echo "::error::requested Vela $requested does not match $lock's vela_version $lock_version"
          exit 1
        fi
        release="v$lock_version"
        install_root="${RUNNER_TEMP:?}/vela-action-$lock_version"
        policy_root="$install_root/share/polkit-1/actions"
        # install.sh ships with this exact action tag. It fetches the platform
        # asset from the matching GitHub release and verifies its SHA-256.
        if [ -f "$ACTION_PATH/install.sh" ]; then
          VELA_VERSION="$release" \
            VELA_INSTALL_PREFIX="$install_root" \
            VELA_POLKIT_POLICY_DIR="$policy_root" \
            bash "$ACTION_PATH/install.sh"
        else
          curl -fsSL "https://raw.githubusercontent.com/vela-science/vela/$release/install.sh" \
            | VELA_VERSION="$release" \
                VELA_INSTALL_PREFIX="$install_root" \
                VELA_POLKIT_POLICY_DIR="$policy_root" \
                bash
        fi
        version_output="$("$install_root/bin/vela" --version)"
        installed="${version_output##* }"
        installed="${installed#v}"
        if [ "$installed" != "$lock_version" ]; then
          echo "::error::installed Vela $installed does not match $lock's vela_version $lock_version"
          exit 1
        fi
        echo "$install_root/bin" >> "$GITHUB_PATH"
        echo "$version_output (matches $lock)"

    - name: Install the exact consumer boundary pin
      shell: bash
      env:
        FRONTIER: ${{ inputs.frontier }}
        REPOSITORY_BOUNDARY_ROOT: ${{ inputs.repository-boundary-root }}
      run: |
        set -euo pipefail
        if [ -z "$REPOSITORY_BOUNDARY_ROOT" ]; then
          echo "No new administrator-boundary pin supplied; strict verification will use an existing exact pin or permit only a legacy or structural-genesis repository."
          exit 0
        fi
        preview="$(vela frontier trust pin "$FRONTIER" \
          --boundary-root "$REPOSITORY_BOUNDARY_ROOT" --json)"
        plan_root="$(printf '%s' "$preview" | python3 -c 'import json,sys; print(json.load(sys.stdin)["plan_root"])')"
        observed_at="$(printf '%s' "$preview" | python3 -c 'import json,sys; print(json.load(sys.stdin)["observed_at"])')"
        vela frontier trust pin "$FRONTIER" \
          --boundary-root "$REPOSITORY_BOUNDARY_ROOT" \
          --confirm-root "$plan_root" --confirm-at "$observed_at" --json

    - name: Strict read-only repository verification
      shell: bash
      env:
        FRONTIER: ${{ inputs.frontier }}
      run: |
        set -euo pipefail
        if ! vela check "$FRONTIER" --strict; then
          echo "::error::strict Vela verification failed; replay, repository context, signatures, committed projections, or trust debt is blocking"
          exit 1
        fi
        echo "strict verification OK — exact repository and scientific-state roots reproduce"
