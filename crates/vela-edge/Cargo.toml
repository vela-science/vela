[package]
name = "vela-edge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Replaceable filesystem, Git, and non-authoritative analysis adapters for Vela."
readme = "../../README.md"
publish = false
[lib]
name = "vela_edge"
path = "src/lib.rs"
[dependencies]
vela-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
rand_core.workspace = true
same-file = "1.0.6"
tempfile.workspace = true
unicode-normalization.workspace = true
rustix = { version = "1", features = ["fs", "process"] }
[dev-dependencies]
vela-protocol = { workspace = true, features = ["test-support"] }
[lints]
workspace = true
