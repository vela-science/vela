schema_version = "1.3"

artifacts = [{ source = "/logs/artifacts/264.lean", destination = "264.lean" }]

[task]
name = "vela/erdos-264-proof-repair-{{ARM}}"
description = "Repair one real post-correction Lean theorem from an exact Frontier Target."
authors = [{ name = "Vela" }]
keywords = ["vela", "lean", "formal-mathematics", "correction-inheritance"]

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "chatgpt.com", "*.chatgpt.com", "*.auth.openai.com"]

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

[environment]
network_mode = "no-network"
cpus = 4
memory_mb = 12288
storage_mb = 20480
