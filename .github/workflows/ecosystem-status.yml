name: Re-observe the ecosystem

# Keep `ecosystem-status.json` from ageing into a failure nothing can clear.
#
# Every observation in that file carries an instant, and `--check` refuses one
# older than 180 days. That check runs inside conformance, which has no network
# and no sibling checkouts — so when the fuse blows, the job that refuses is the
# one job that cannot repair it, and the repair has to come from somewhere else.
# This is that somewhere else.
#
# It refreshes what a repository-scoped token can actually see, and says what it
# could not. Two rows are beyond it and always will be:
#
#   `vela-science/vela-web` is private, so `GITHUB_TOKEN` here can read neither
#   its remote nor a checkout of it. `observe_remote` reports and continues.
#
#   The `local-checkout` observations record a replay against a working tree,
#   which needs the repository cloned and a matching `vela` binary. Cheap on a
#   laptop, a five-minute build here, and only two rows carry one.
#
# So this closes the seven remote rows and the projection, and the age message
# names the exact command for the rest. An alarm with no exit is worse than no
# alarm.

on:
  workflow_dispatch:
  schedule:
    # Monthly, well inside the 180-day horizon. An observation is a fact about
    # another repository, and re-reading it daily would churn the artifact
    # without learning anything the previous read did not already say.
    - cron: "23 6 1 * *"

permissions:
  contents: read

concurrency:
  group: ecosystem-status
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Not persisted into .git/config, so no later step inherits a token it
          # has no use for. The one push below supplies it explicitly.
          persist-credentials: false

      - name: Re-observe the remotes and the deployed projection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/ecosystem-status.py \
            --observe-remote \
            --observe-projection https://app.vela.space/.well-known/vela-site.json
          python3 scripts/ecosystem-status.py --check

      # Committed rather than merely checked, because the point is to move the
      # instants forward in the file conformance reads. Nothing else in this
      # repository writes it on a schedule.
      - name: Record what changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if git diff --quiet -- ecosystem-status.json; then
            echo "::notice::No observation changed."
            exit 0
          fi
          git diff --stat -- ecosystem-status.json
          git config user.name "vela-ecosystem[bot]"
          git config user.email "ecosystem@vela.space"
          git add -- ecosystem-status.json
          git commit -m "Re-observe the ecosystem" \
            -m "Scheduled refresh of the remote observations and the deployed projection. The local-checkout rows are not refreshed here; see the age message for the command."
          # The token goes through the credential helper for this push alone,
          # never into .git/config where every later step would inherit it.
          push() {
            git -c credential.helper='!f() { echo "username=x-access-token"; echo "password=$GH_TOKEN"; }; f' \
              push origin "HEAD:${GITHUB_REF_NAME}"
          }
          # Same race the projection refresh hits: this runs on a schedule while
          # people push. Rebase and retry rather than fail on an ordering.
          if ! push; then
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            push
          fi
