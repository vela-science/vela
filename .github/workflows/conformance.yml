# Public conformance CI for the Vela product monorepo. A green run shows that
# the current Rust boundary, portable object vectors, and frozen verifiers
# reproduce from the checked-out source.
name: conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `rust-toolchain.toml` is where this workspace says which Rust it is.
      # The action takes the version as a string, so this reads that file
      # rather than restating the number: a bump is one edit, in the file
      # rustup already obeys, and CI cannot be left building a different
      # compiler than a local `cargo` invocation picks up.
      - id: toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-19
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: conformance/uv.lock
      - name: audit GitHub Actions contracts
        run: uv run --project conformance --locked zizmor --offline --min-severity medium .
      - name: install the exact dependency-policy checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: enforce dependency advisories, licenses, bans, and sources
        run: cargo deny --locked check
      - name: sync the locked independent reader
        run: uv sync --project conformance --locked
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --locked --release -p vela-cli --bin vela
      - name: complete Rust protocol and task-first test union
        run: uv run --project conformance --locked ./conformance/check-core.sh
      - name: current Submission and Verification interoperability waist
        env:
          VELA_EPHEMERAL_ACCOUNT_HOME: "1"
        run: ./conformance/check-current-object-waist.sh
      # `install.sh` reads a digest out of the release manifest, and the two
      # sides had never been run against each other: the generator emits
      # `sha256:<hex>` and the installer's parse required bare hex, so every
      # real install would have been refused by a check written to protect it.
      # This runs the real installer over a release the real generator wrote,
      # signed with a throwaway identity through `VELA_ALLOWED_SIGNERS`. No
      # network, no `gh`, no secret — which is the same claim the installer
      # makes about itself.
      - name: Provider-independent install path
        run: uv run --project conformance --locked python conformance/test_release_install.py
      # The resolver each Repository locks its sources with. It has its own
      # project and its own lock, so it runs as its own step rather than being
      # folded into the conformance environment, which would give one of them
      # an opinion about the other's dependencies.
      - name: shared source-manifest package
        run: uv run --project packages/vela-source-manifest --locked --group dev pytest packages/vela-source-manifest/tests -q
      # Two Repositories pin a commit of `research/lean-replay-contract` and import
      # it, and the only thing in this job that reached it was the Rust reader
      # in crates/vela-protocol/tests. That reader reproduces the package ROOT,
      # so a byte moving is caught — but the package's own axiom vectors, its
      # fail-closed mutation check and its manifest-schema check ran nowhere,
      # and those are the behaviour the consumers import.
      #
      # The root comparison is the other half. `build_root.py` and that Rust
      # reader are the two independent readers the package's promotion criteria
      # require to agree, and only one of them ever ran: a test named
      # "independent reader" had nothing to be independent of. The digest is
      # read out of that test rather than restated here, so freezing a new root
      # stays one edit in one file. Both checks need only rfc8785 and
      # jsonschema, which the conformance project already locks.
      - name: source-local Lean replay contract
        run: |
          set -euo pipefail
          uv run --project conformance --locked \
            python research/lean-replay-contract/test_contract.py
          frozen="$(sed -n '/^const EXPECTED_ROOT/,/;$/s/.*"\(sha256:[0-9a-f]\{64\}\)".*/\1/p' \
            crates/vela-protocol/tests/lean_replay_package_candidate.rs)"
          test -n "$frozen"
          built="$(uv run --project conformance --locked \
            python research/lean-replay-contract/build_root.py \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["package_root"])')"
          if [ "$built" != "$frozen" ]; then
            echo "::error::build_root.py reports $built; the frozen Rust reader expects $frozen"
            exit 1
          fi
          echo "package root $built (both readers agree)"
      - name: reproduce (CLI re-derives the synthetic valid corpus)
        run: ./target/release/vela reproduce crates/vela-verify/corpus/valid/smoke
