# Release semantics live in `scripts/release.sh`, not here.
#
# This file used to be the only place the release existed, which meant a
# release could not be built, read, or reproduced anywhere but inside GitHub
# Actions. What is left here is the part that is genuinely provider-bound:
# checkout, toolchain installation, the syft download, artifact transport,
# `actions/attest-build-provenance` (OIDC-bound to a GitHub identity, with no
# provider-neutral equivalent), and `gh release create`.
#
# Everything that decides what a release *is* — version and tag agreement, the
# toolchain channel, the auditable build, staging, the SPDX SBOM, the SBOM
# content check, archiving, checksums, the bundle smoke test, and the signed
# release manifest — is in the entry point, and runs the same way on a laptop
# with no network beyond the crate registry.
name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Asks the entry point rather than reading `Cargo.toml` a second way. Two
      # readers of one version is how a release gets identified one way here
      # and another way in the build.
      - id: version
        name: Bind release identity
        shell: bash
        run: |
          version="$(scripts/release.sh --print-version)"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "v$version" = "$GITHUB_REF_NAME"
          else
            test "$GITHUB_REF" = refs/heads/main
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    name: build-${{ matrix.asset }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: vela-linux-x86_64.tar.gz
          - runner: macos-15
            asset: vela-macos-aarch64.zip
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Read from `rust-toolchain.toml`, not restated: the published binary and
      # the conformance run must be built by the same compiler, and the only
      # way to guarantee that is for neither workflow to hold its own copy of
      # the number. `scripts/release.sh` reads the same file and refuses to
      # build when the installed rustc is not that channel, so the pin is
      # enforced rather than merely requested.
      - id: toolchain
        shell: bash
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-19
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # Downloads the pinned syft and nothing else. The full `anchore/sbom-action`
      # decided the scan path, the format and the output file, and those are
      # release semantics: they now live in the entry point, which invokes syft
      # directly and refuses a version other than the one it names. Same commit
      # pin the full action carried.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.50.0
      # One entry point, in this order: version/tag agreement, toolchain
      # channel, `cargo auditable build --locked`, staging, the SPDX SBOM,
      # `check-sbom.py`, archive, checksums, `smoke-bundle.sh`, manifest.
      #
      # The manifest is unsigned here. Signing it needs the distribution
      # identity's private key, and putting that in Actions would make the
      # provider-neutral artifact depend on the provider again. It is signed
      # out of band by `scripts/sign-published-release.sh`, which signs these
      # exact published bytes and then publishes the draft.
      #
      # Not `scripts/release.sh --sign-key`, which rebuilds: a rebuild is a
      # different archive, so the manifest would describe bytes no release
      # carries and `install.sh` would refuse every install.
      - name: Build the release bundle
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          arguments=(--manifest-name "$ASSET.release-manifest.json")
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            arguments+=(--tag "$GITHUB_REF_NAME")
          fi
          scripts/release.sh "${arguments[@]}"
      - name: Attest archive, SBOM, and manifest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.spdx.json
            dist/${{ matrix.asset }}.release-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  smoke:
    needs: [metadata, build]
    name: smoke-${{ matrix.asset }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: vela-linux-x86_64.tar.gz
          - runner: macos-15
            asset: vela-macos-aarch64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist
      - name: Smoke release bundle
        run: .github/release/smoke-bundle.sh "dist/${{ matrix.asset }}" "${{ needs.metadata.outputs.version }}"

  publish:
    if: github.event_name == 'push'
    needs: [metadata, build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      # Published as a DRAFT, and the draft is the whole point.
      #
      # A published release here is immutable, which is the right property for a
      # scientific artifact and is incompatible with signing afterwards: the
      # manifest is built here and deliberately not signed here — the
      # distribution identity must not live in Actions — so the signature has to
      # be attached by an operator, and an immutable release refuses new assets
      # with `422 Cannot upload assets to an immutable release`.
      #
      # A draft is mutable and invisible. `scripts/sign-published-release.sh`
      # signs the manifest this job produced, uploads the sidecar, and then
      # publishes — at which point the release becomes immutable WITH its
      # signature inside. Both properties survive, and the unsigned intermediate
      # state is never something a consumer can see or install.
      - name: Publish the release as a draft for signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in vela-linux-x86_64.tar.gz vela-macos-aarch64.zip; do
            test -f "dist/$asset"
            test -f "dist/$asset.sha256"
            test -f "dist/$asset.spdx.json"
            test -f "dist/$asset.spdx.json.sha256"
            # One manifest per built bundle, named after it. A single
            # cross-target manifest would have to be assembled in a job holding
            # both, and signed by whatever key that job could reach — which is
            # the provider coupling the manifest exists to remove.
            test -f "dist/$asset.release-manifest.json"
          done
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${release_flags[@]}" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag
          echo "::notice::${GITHUB_REF_NAME} is a draft until it is signed. Run:" \
               "scripts/sign-published-release.sh ${GITHUB_REF_NAME} <distribution public key>" 
