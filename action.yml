# vela-check — strictly verify one clean Git-native Vela frontier.
#
# Consume from a frontier repository:
#
#   - uses: actions/checkout@v5
#   - uses: vela-science/vela@v0.940.6
#     with:
#       frontier: .
#       vela-version: v0.940.6
#       authority-record-root: ${{ vars.VELA_AUTHORITY_RECORD_ROOT }}
#
# For a current Profile v2 repository, the sequence-1 authority-record root
# must come from protected GitHub repository or organization configuration,
# never from the proposed checkout. The action installs that public consumer
# pin in the ephemeral runner account and runs the strict read-only verifier.
# It never signs, decides, or changes Frontier state.

name: vela-check
description: >-
  Strictly verifies a clean Git-native Vela frontier with an optional exact
  out-of-band repository-boundary pin.

inputs:
  frontier:
    description: Path to the frontier directory within the consumer repo.
    required: false
    default: "."
  vela-version:
    description: >-
      Required reviewed Vela release tag (e.g. v0.940.6). The consumer chooses
      this pin; proposed Frontier bytes cannot select or downgrade the verifier.
    required: true
  authority-record-root:
    description: >-
      Full sha256 content root of the sequence-1 authority record. Required
      for a current Profile v2 repository. Supply it from a
      protected GitHub repository or organization variable, not from a file in
      the proposed checkout. Omit it only when the runner already has the exact
      local pin.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install vela (pinned release binary, no from-source build)
      shell: bash
      env:
        VELA_VERSION_INPUT: ${{ inputs.vela-version }}
        FRONTIER: ${{ inputs.frontier }}
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        requested="${VELA_VERSION_INPUT#v}"
        if [ -z "$requested" ]; then
          echo "::error::vela-version is required; proposed Frontier bytes cannot select the verifier"
          exit 1
        fi
        if ! printf '%s' "$requested" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::vela-version must be one stable exact release"
          exit 1
        fi
        release="v$requested"
        install_root="${RUNNER_TEMP:?}/vela-action-$requested"
        policy_root="$install_root/share/polkit-1/actions"
        # install.sh ships with this exact action tag. It fetches the platform
        # asset from the matching GitHub release and verifies its SHA-256.
        if [ -f "$ACTION_PATH/install.sh" ]; then
          VELA_VERSION="$release" \
            VELA_INSTALL_PREFIX="$install_root" \
            VELA_POLKIT_POLICY_DIR="$policy_root" \
            bash "$ACTION_PATH/install.sh"
        else
          curl -fsSL "https://raw.githubusercontent.com/vela-science/vela/$release/install.sh" \
            | VELA_VERSION="$release" \
                VELA_INSTALL_PREFIX="$install_root" \
                VELA_POLKIT_POLICY_DIR="$policy_root" \
                bash
        fi
        version_output="$("$install_root/bin/vela" --version)"
        installed="${version_output##* }"
        installed="${installed#v}"
        if [ "$installed" != "$requested" ]; then
          echo "::error::installed Vela $installed does not match requested Vela $requested"
          exit 1
        fi
        echo "$install_root/bin" >> "$GITHUB_PATH"
        echo "$version_output (matches the consumer pin)"

    - name: Install the exact consumer authority pin
      shell: bash
      env:
        FRONTIER: ${{ inputs.frontier }}
        AUTHORITY_RECORD_ROOT: ${{ inputs.authority-record-root }}
      run: |
        set -euo pipefail
        if [ -z "$AUTHORITY_RECORD_ROOT" ]; then
          echo "No authority-record root supplied; strict verification will use an existing exact local pin or fail closed."
          exit 0
        fi
        vela authority trust pin "$FRONTIER" \
          --record-root "$AUTHORITY_RECORD_ROOT" --json

    - name: Strict read-only repository verification
      shell: bash
      env:
        FRONTIER: ${{ inputs.frontier }}
      run: |
        set -euo pipefail
        if ! vela check "$FRONTIER" --strict; then
          echo "::error::strict Vela verification failed; replay, repository context, signatures, committed projections, or trust debt is blocking"
          exit 1
        fi
        echo "strict verification OK — exact repository and scientific-state roots reproduce"
