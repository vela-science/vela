name: release

on:
  workflow_dispatch:
    inputs:
      stable-candidate:
        description: Build and smoke a stable-version commit without publishing it.
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Bind the candidate or release identity
        id: version
        shell: bash
        run: |
          version="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as source:
              print(tomllib.load(source)["workspace"]["package"]["version"])
          PY
          )"
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "v$version" = "$GITHUB_REF_NAME" || {
              echo "release tag $GITHUB_REF_NAME does not match Vela workspace version v$version" >&2
              exit 1
            }
          else
            test "$GITHUB_REF" = "refs/heads/main" || {
              echo "manual release-candidate builds must use main" >&2
              exit 1
            }
            case "$version" in
              *-*) ;;
              *)
                test "${{ inputs['stable-candidate'] }}" = "true" || {
                  echo "a stable-version manual candidate requires stable-candidate=true" >&2
                  exit 1
                }
                ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    name: build-${{ matrix.asset }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: vela-linux-x86_64.tar.gz
          - runner: macos-15
            asset: vela-macos-aarch64.zip
          - runner: windows-2025
            asset: vela-windows-x86_64.zip
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-19
      - name: Require every Vela workspace package to match the bound version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          package_version() {
            local package_id
            package_id="$(cargo pkgid --locked -p "$1")"
            package_id="${package_id##*#}"
            printf '%s' "${package_id##*@}"
          }
          version="$(package_version vela-cli)"
          test "$version" = "$EXPECTED_VERSION" || {
            echo "Vela workspace version $version does not match bound version $EXPECTED_VERSION" >&2
            exit 1
          }
          for package in vela-authority vela-edge vela-protocol vela-verify; do
            observed="$(package_version "$package")"
            test "$observed" = "$version" || {
              echo "Vela workspace version mismatch: vela-cli=$version, $package=$observed" >&2
              exit 1
            }
          done
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build release binary
        run: cargo build --locked --release -p vela-cli --bin vela
      - name: Stage Unix bundle
        if: runner.os != 'Windows'
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p dist stage
          cp target/release/vela stage/
      - name: Stage Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, stage | Out-Null
          Copy-Item target/release/vela.exe stage/
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: stage
          format: spdx-json
          output-file: dist/${{ matrix.asset }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Prepare Linux archive
        if: runner.os == 'Linux'
        env:
          ASSET: ${{ matrix.asset }}
        run: tar -C stage -czf "dist/$ASSET" .
      - name: Prepare macOS archive
        if: runner.os == 'macOS'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: ditto -c -k --norsrc stage/ "dist/$ASSET"
      - name: Prepare Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          Compress-Archive -Path stage/vela.exe -DestinationPath "dist/$env:ASSET"
      - name: Record the exact portable trust tier
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 - "$ASSET" "$VERSION" "$GITHUB_SHA" > "dist/$ASSET.trust.json" <<'PY'
          import json
          import sys

          asset, version, commit = sys.argv[1:]
          platform = (
              "macos" if "macos" in asset else
              "windows" if "windows" in asset else
              "linux"
          )
          print(json.dumps({
              "schema": "vela.release-trust.v1",
              "artifact": asset,
              "artifact_class": "portable",
              "github_attestation": "required",
              "platform": platform,
              "platform_signature": "absent",
              "source_commit": commit,
              "version": version,
          }, sort_keys=True, separators=(",", ":")))
          PY
      - name: Write archive and SBOM checksums on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          cd dist
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          shasum -a 256 "$ASSET.spdx.json" > "$ASSET.spdx.json.sha256"
          shasum -a 256 "$ASSET.trust.json" > "$ASSET.trust.json.sha256"
      - name: Write archive and SBOM checksums on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          Set-Location dist
          foreach ($name in @($env:ASSET, "$($env:ASSET).spdx.json", "$($env:ASSET).trust.json")) {
            $digest = (Get-FileHash -Algorithm SHA256 $name).Hash.ToLowerInvariant()
            $checksum = "$($name).sha256"
            Set-Content -Encoding ascii -NoNewline -LiteralPath $checksum -Value "$digest  $name"
            if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) {
              throw "checksum sidecar was not written: $checksum"
            }
          }
      - name: Attest archive and SBOM provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.spdx.json
            dist/${{ matrix.asset }}.trust.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  smoke:
    needs: [metadata, build]
    name: smoke-${{ matrix.asset }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: vela-linux-x86_64.tar.gz
          - runner: macos-15
            asset: vela-macos-aarch64.zip
          - runner: windows-2025
            asset: vela-windows-x86_64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist
      - name: Smoke exact Unix bundle in a fresh prefix
        if: runner.os != 'Windows'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
          REQUIRE_PLATFORM_SIGNATURE: false
        run: .github/release/smoke-bundle.sh "dist/$ASSET" "$EXPECTED_VERSION" "$REQUIRE_PLATFORM_SIGNATURE"
      - name: Smoke exact Windows bundle in a fresh prefix
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
          REQUIRE_PLATFORM_SIGNATURE: false
        run: .github/release/smoke-bundle.ps1 -Archive "dist/$env:ASSET" -ExpectedVersion $env:EXPECTED_VERSION -RequirePlatformSignature ($env:REQUIRE_PLATFORM_SIGNATURE -eq "true")

  publish-crates:
    if: github.event_name == 'push' && needs.metadata.outputs.prerelease != 'true'
    needs: [metadata, smoke]
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-19
      - name: Exchange GitHub OIDC identity for a short-lived crates.io token
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish the dependency-ordered immutable crate graph
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: .github/release/publish-crates.sh --execute

  registry-smoke:
    if: github.event_name == 'push' && needs.metadata.outputs.prerelease != 'true'
    needs: [metadata, publish-crates]
    name: registry-smoke-${{ matrix.os }}
    strategy:
      # Registry indexes and CDN edges do not expose a newly published crate at
      # exactly the same instant on every platform. Preserve every platform's
      # evidence instead of cancelling the matrix when one edge is slower.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-19
      - name: Install exact immutable crates.io package
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          package_url="https://crates.io/api/v1/crates/vela-cli/$VERSION"
          ready=false
          for _ in $(seq 1 60); do
            if curl \
              --user-agent "vela-release-smoke/$VERSION (https://github.com/vela-science/vela)" \
              --fail --silent --show-error \
              "$package_url" >/dev/null
            then
              ready=true
              break
            fi
            sleep 5
          done
          "$ready" || {
            echo "vela-cli $VERSION was not readable from crates.io within 300 seconds" >&2
            exit 1
          }
          root="$RUNNER_TEMP/vela-registry-install"
          cargo install --locked vela-cli --version "$VERSION" --root "$root"
          "$root/bin/vela" --version | grep -F "vela $VERSION"

  publish:
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        needs.metadata.result == 'success' &&
        needs.build.result == 'success' &&
        needs.smoke.result == 'success' &&
        (
          needs.registry-smoke.result == 'success' ||
          (
            needs.metadata.outputs.prerelease == 'true' &&
            needs.registry-smoke.result == 'skipped'
          )
        )
      }}
    needs: [metadata, build, smoke, publish-crates, registry-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in \
            vela-linux-x86_64.tar.gz \
            vela-macos-aarch64.zip \
            vela-windows-x86_64.zip
          do
            test -f "dist/$asset"
            test -f "dist/$asset.sha256"
            test -f "dist/$asset.spdx.json"
            test -f "dist/$asset.spdx.json.sha256"
            test -f "dist/$asset.trust.json"
            test -f "dist/$asset.trust.json.sha256"
          done
          release_flags=(
            --verify-tag
            --title "$GITHUB_REF_NAME"
            --notes-from-tag
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${release_flags[@]}"
