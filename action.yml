# vela-check — strictly verify one clean Git-native Vela frontier.
#
# Consume from a frontier repository:
#
#   - uses: actions/checkout@v5
#   - uses: vela-science/vela@v0.965.3
#     with:
#       frontier: .
#
# Current repositories carry one signed repository origin and authority
# initialization record. The action verifies that closed boundary directly
# with the pinned released binary. It never installs trust state, signs,
# decides, or changes Frontier state.

name: vela-check
description: Strictly verifies one clean current Git-native Vela Frontier on Linux or macOS.

inputs:
  frontier:
    description: Path to the frontier directory within the consumer repo.
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Require a supported runner
      shell: bash
      run: |
        case "${RUNNER_OS:?}" in
          Linux|macOS) ;;
          *) echo "::error::vela-check supports Linux and macOS runners"; exit 2 ;;
        esac

    - name: Install Vela
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        requested="$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' "$ACTION_PATH/Cargo.toml" | head -n 1)"
        if ! printf '%s' "$requested" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::the pinned Vela action does not contain one stable release"
          exit 1
        fi
        install_root="${RUNNER_TEMP:?}/vela-action-$requested"
        VELA_VERSION="v$requested" VELA_INSTALL_PREFIX="$install_root" \
          bash "$ACTION_PATH/install.sh"
        version_output="$("$install_root/bin/vela" --version)"
        installed="${version_output##* }"
        installed="${installed#v}"
        if [ "$installed" != "$requested" ]; then
          echo "::error::installed Vela $installed does not match requested Vela $requested"
          exit 1
        fi
        echo "$version_output (matches the consumer pin)"

    - name: Read-only repository verification
      shell: bash
      env:
        FRONTIER: ${{ inputs.frontier }}
      run: |
        set -euo pipefail
        requested="$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' "${{ github.action_path }}/Cargo.toml" | head -n 1)"
        vela_bin="${RUNNER_TEMP:?}/vela-action-$requested/bin/vela"
        if ! "$vela_bin" check "$FRONTIER" --json; then
          echo "::error::Vela verification failed; replay, repository context, signatures, committed projections, or trust debt is blocking"
          exit 1
        fi
        echo "verification OK — exact repository and scientific-state roots reproduce"
