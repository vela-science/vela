[project]
name = "vela-source-manifest"
version = "1.0.0"
description = "Producer-side source declarations and locks for Vela Frontiers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
# PyYAML parses the declaration; jsonschema enforces the two normative schemas
# this package ships. Nothing else: this runs in four Frontier CI jobs and in
# whatever shell an acquisition happens in, and every dependency is one more
# thing that can be unavailable on the day a lock needs regenerating.
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.21",
]

[project.scripts]
vela-source-lock = "vela_source_manifest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vela_source_manifest"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
