# Public conformance CI for the Vela substrate. Runs on the PUBLIC repo
# (vela-science/vela), where GitHub Actions is free + unlimited, so it
# sidesteps the private-repo billing block. A green badge here is itself a
# trust signal: anyone can see the substrate builds, lints, tests, and that
# the frozen verifiers re-derive their witnesses from scratch.
name: conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt --all -- --check
      - name: package contains installed verifier resources
        run: |
          cargo package -p vela-cli --list > /tmp/vela-cli-package-files
          grep -Fx resources/external_lean_sandbox.py /tmp/vela-cli-package-files
          grep -Fx resources/diderot_lean_verifier.py /tmp/vela-cli-package-files
          grep -Fx resources/receipt_v1.py /tmp/vela-cli-package-files
          grep -Fx resources/receipt_json.py /tmp/vela-cli-package-files
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --release --workspace
      - name: test (incl. verifier reproduce + reducer parity)
        run: cargo test --workspace
      - name: reproduce (frozen verifiers re-derive every shipped witness)
        run: |
          ./target/release/vela reproduce examples/sidon-a309370
          ./target/release/vela reproduce examples/sidon-sets
          ./target/release/vela reproduce examples/erdos-problems
