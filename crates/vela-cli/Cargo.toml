[package]
name = "vela-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The vela command-line tool: build, check, sign, replay, and publish scientific frontier state."
readme = "../../README.md"
keywords = ["science", "frontier", "protocol", "cli", "replay"]
categories = ["science", "command-line-utilities"]
publish = true

# The `vela` product binary remains separate from the reusable protocol
# kernel so command handling and application dependencies do not enter the
# protocol crate.

[lib]
name = "vela_cli"
path = "src/lib.rs"

[[bin]]
name = "vela"
path = "src/main.rs"

[dependencies]
vela-protocol = { workspace = true }
vela-authority = { workspace = true }
vela-edge.workspace = true
vela-verify = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
serde_yaml = { workspace = true }
colored = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
tempfile = { workspace = true }
same-file = "1.0.6"
unicode-normalization = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
vela-protocol = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
