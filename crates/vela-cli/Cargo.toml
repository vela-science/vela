[package]
name = "vela-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The Vela command-line tool: inspect, submit, verify, decide, and replay scientific state."
readme = "../../README.md"
keywords = ["science", "frontier", "protocol", "cli", "replay"]
categories = ["science", "command-line-utilities"]
publish = false

# The `vela` product binary remains separate from the reusable protocol
# kernel so command handling and application dependencies do not enter the
# protocol crate.

[lib]
name = "vela_cli"
path = "src/lib.rs"

[[bin]]
name = "vela"
path = "src/main.rs"

[dependencies]
vela-protocol = { workspace = true }
vela-authority = { workspace = true }
vela-edge.workspace = true
vela-verify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono.workspace = true
toml = { workspace = true }
colored = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
ssh-key = { workspace = true }
ssh-encoding = { workspace = true }
tempfile = { workspace = true }
same-file = "1.0.6"
unicode-normalization = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
vela-protocol = { workspace = true }

[lints]
workspace = true
