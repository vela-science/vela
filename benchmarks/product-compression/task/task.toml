schema_version = "1.3"

[task]
name = "vela/product-compression-{{SESSION_ID}}"
description = "Matched read-only Vela product-compression task."
authors = [{ name = "Vela" }]
keywords = ["vela", "read-only", "product-compression"]

[agent]
timeout_sec = 900.0
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "chatgpt.com", "*.chatgpt.com", "*.auth.openai.com"]

[verifier]
timeout_sec = 60.0
environment_mode = "shared"
network_mode = "no-network"

[environment]
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 8192
