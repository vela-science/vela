# vela-repository-verify — strictly verify one clean Git-native Vela repository.
#
# Consume from a Vela repository:
#
#   - uses: actions/checkout@v5
#   - uses: vela-science/vela@v0.967.0
#     with:
#       repository: .
#
# Current repositories carry one signed repository origin and authority
# initialization record. The action verifies that closed boundary directly
# with the pinned released binary. It never installs trust state, signs,
# decides, or changes repository state.
#
# It then runs the three repository-shape checks that every repository owes and
# none of them owns: its GitHub Actions contracts, the committed source lock
# against the declaration its own generator reads, and the repository lint. Those
# live here rather than in four workflows because four copies of a check is the
# shape the lint exists to report. All three are read-only and none touches the
# repository: `zizmor` and the linter only read, `--check` never writes, and the
# Python environment they need is built from this repository's own locks inside
# the action checkout.
#
# What each repository still owns is its own test suite. The action cannot run
# that: there is no convention here for what a repository's tests are, and
# inventing one would make this action guess at repositories it cannot see.

name: vela-repository-verify
description: >-
  Strictly verifies one clean current Git-native Vela repository on Linux or
  macOS, then checks its source lock and repository shape. Read-only.

inputs:
  repository:
    description: Path to the Vela repository directory within the consumer repo.
    required: false
    default: ""
  frontier:
    description: >-
      DEPRECATED alias for `repository`. ADR 0039 made the Repository the
      authority boundary and left the Frontier derived, so this key names
      something the action never took. It stays because pinned consumer
      workflows pass it and cannot be edited from here; new callers pass
      `repository`. Setting both to different paths fails.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Require a supported runner
      shell: bash
      run: |
        case "${RUNNER_OS:?}" in
          Linux|macOS) ;;
          *) echo "::error::vela-repository-verify supports Linux and macOS runners"; exit 2 ;;
        esac

    # A composite action has no alias mechanism: two keys are two inputs, and
    # the only place they can be made one is a step. Both default to empty
    # rather than to "." so that unset stays distinguishable from set — with a
    # "." default on `repository`, a pinned consumer passing `frontier: subdir`
    # would arrive here as two different non-empty paths and trip the
    # disagreement check that exists to protect it. The "." this action has
    # always meant is restored below, once, after the coalesce.
    - name: Resolve the repository path
      id: resolve
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        FRONTIER: ${{ inputs.frontier }}
      run: |
        set -euo pipefail
        if [ -n "$FRONTIER" ]; then
          echo "::warning::the 'frontier' input is deprecated; rename it to 'repository'"
        fi
        if [ -n "$REPOSITORY" ] && [ -n "$FRONTIER" ] && [ "$REPOSITORY" != "$FRONTIER" ]; then
          echo "::error::repository ($REPOSITORY) and its deprecated alias frontier ($FRONTIER) name different paths; pass one"
          exit 2
        fi
        resolved="${REPOSITORY:-${FRONTIER:-.}}"
        # A step output is a line in a file, so a value carrying a newline
        # writes a second key rather than a path. No repository directory is
        # spelled that way; a value that is has been constructed.
        if [ "$resolved" != "${resolved%%$'\n'*}" ]; then
          echo "::error::the repository path must be a single line"
          exit 2
        fi
        echo "path=$resolved" >> "${GITHUB_OUTPUT:?}"
        echo "verifying the repository at $resolved"

    - name: Install Vela
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        requested="$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' "$ACTION_PATH/Cargo.toml" | head -n 1)"
        if ! printf '%s' "$requested" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::the pinned Vela action does not contain one stable release"
          exit 1
        fi
        install_root="${RUNNER_TEMP:?}/vela-action-$requested"
        VELA_VERSION="v$requested" VELA_INSTALL_PREFIX="$install_root" \
          bash "$ACTION_PATH/install.sh"
        version_output="$("$install_root/bin/vela" --version)"
        installed="${version_output##* }"
        installed="${installed#v}"
        if [ "$installed" != "$requested" ]; then
          echo "::error::installed Vela $installed does not match requested Vela $requested"
          exit 1
        fi
        echo "$version_output (matches the consumer pin)"

    - name: Read-only repository verification
      shell: bash
      env:
        REPOSITORY_PATH: ${{ steps.resolve.outputs.path }}
      run: |
        set -euo pipefail
        requested="$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' "${{ github.action_path }}/Cargo.toml" | head -n 1)"
        vela_bin="${RUNNER_TEMP:?}/vela-action-$requested/bin/vela"
        if ! "$vela_bin" replay "$REPOSITORY_PATH" --json; then
          echo "::error::Vela replay failed; the log, repository context, signatures, committed projections, or trust debt is blocking"
          exit 1
        fi
        echo "verification OK — exact repository and scientific-state roots reproduce"

    # Both shape checks resolve from locks committed in this repository, so what
    # they install is decided by the SHA the consumer pinned and not by the day
    # the job ran. The uv version and interpreter match the ones this
    # repository's own conformance job uses.
    - name: Install the locked reader for the shape checks
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        version: "0.11.32"
        python-version: "3.13"

    # The same audit, at the same version and threshold, that this repository
    # runs over its own workflows. It arrives through the pin a repository already
    # consumes, so adopting it is not a fifth edit in a fifth repository.
    #
    # This replaced a hand-written `unpinned-action` rule in `repository_lint.py`.
    # zizmor's blanket policy already requires a hash — with no configuration
    # file — and it reads the workflow rather than the line, so it also reports
    # the permission scopes, credential persistence and cache exposure that a
    # regex over `uses:` could never see.
    - name: Repository GitHub Actions contracts
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPOSITORY_PATH: ${{ steps.resolve.outputs.path }}
      run: |
        set -euo pipefail
        # zizmor errors rather than passing when collection finds nothing, so a
        # repository that runs no Actions at all is skipped here explicitly. Same
        # shape, and same reason, as the source-declaration check below: absent
        # is not the same as failing.
        if [ ! -d "$REPOSITORY_PATH/.github" ]; then
          echo "no GitHub Actions in this repository; nothing to audit"
          exit 0
        fi
        uv run --project "$ACTION_PATH/conformance" --locked \
          zizmor --offline --min-severity medium --no-progress "$REPOSITORY_PATH"

    - name: Committed source lock matches its declaration
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPOSITORY_PATH: ${{ steps.resolve.outputs.path }}
      run: |
        set -euo pipefail
        # No declaration, nothing to check. A lock without one is not silently
        # accepted here — the linter's generated-file rule owns that case, and
        # restating it would make two owners that can disagree.
        if [ ! -f "$REPOSITORY_PATH/sources.yaml" ]; then
          echo "no source declaration in this repository; nothing to check"
          exit 0
        fi
        uv run --project "$ACTION_PATH/packages/vela-source-manifest" --locked \
          vela-source-lock --check "$REPOSITORY_PATH"

    - name: Repository shape
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPOSITORY_PATH: ${{ steps.resolve.outputs.path }}
      run: |
        set -euo pipefail
        uv run --project "$ACTION_PATH/conformance" --locked \
          python "$ACTION_PATH/conformance/repository_lint.py" "$REPOSITORY_PATH"
