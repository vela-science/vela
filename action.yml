# vela-frontier-verify — strictly verify one clean Git-native Vela frontier.
#
# Consume from a frontier repository:
#
#   - uses: actions/checkout@v5
#   - uses: vela-science/vela@v0.966.4
#     with:
#       frontier: .
#
# Current repositories carry one signed repository origin and authority
# initialization record. The action verifies that closed boundary directly
# with the pinned released binary. It never installs trust state, signs,
# decides, or changes Frontier state.
#
# It then runs the three repository-shape checks that every Frontier owes and
# none of them owns: its GitHub Actions contracts, the committed source lock
# against the declaration its own generator reads, and the Frontier lint. Those
# live here rather than in four workflows because four copies of a check is the
# shape the lint exists to report. All three are read-only and none touches the
# Frontier: `zizmor` and the linter only read, `--check` never writes, and the
# Python environment they need is built from this repository's own locks inside
# the action checkout.
#
# What each Frontier still owns is its own test suite. The action cannot run
# that: there is no convention here for what a Frontier's tests are, and
# inventing one would make this action guess at repositories it cannot see.

name: vela-frontier-verify
description: >-
  Strictly verifies one clean current Git-native Vela Frontier on Linux or
  macOS, then checks its source lock and repository shape. Read-only.

inputs:
  frontier:
    description: Path to the frontier directory within the consumer repo.
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Require a supported runner
      shell: bash
      run: |
        case "${RUNNER_OS:?}" in
          Linux|macOS) ;;
          *) echo "::error::vela-frontier-verify supports Linux and macOS runners"; exit 2 ;;
        esac

    - name: Install Vela
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        requested="$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' "$ACTION_PATH/Cargo.toml" | head -n 1)"
        if ! printf '%s' "$requested" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::the pinned Vela action does not contain one stable release"
          exit 1
        fi
        install_root="${RUNNER_TEMP:?}/vela-action-$requested"
        VELA_VERSION="v$requested" VELA_INSTALL_PREFIX="$install_root" \
          bash "$ACTION_PATH/install.sh"
        version_output="$("$install_root/bin/vela" --version)"
        installed="${version_output##* }"
        installed="${installed#v}"
        if [ "$installed" != "$requested" ]; then
          echo "::error::installed Vela $installed does not match requested Vela $requested"
          exit 1
        fi
        echo "$version_output (matches the consumer pin)"

    - name: Read-only repository verification
      shell: bash
      env:
        FRONTIER: ${{ inputs.frontier }}
      run: |
        set -euo pipefail
        requested="$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' "${{ github.action_path }}/Cargo.toml" | head -n 1)"
        vela_bin="${RUNNER_TEMP:?}/vela-action-$requested/bin/vela"
        if ! "$vela_bin" replay "$FRONTIER" --json; then
          echo "::error::Vela replay failed; the log, repository context, signatures, committed projections, or trust debt is blocking"
          exit 1
        fi
        echo "verification OK — exact repository and scientific-state roots reproduce"

    # Both shape checks resolve from locks committed in this repository, so what
    # they install is decided by the SHA the consumer pinned and not by the day
    # the job ran. The uv version and interpreter match the ones this
    # repository's own conformance job uses.
    - name: Install the locked reader for the shape checks
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.11.32"
        python-version: "3.13"

    # The same audit, at the same version and threshold, that this repository
    # runs over its own workflows. It arrives through the pin a Frontier already
    # consumes, so adopting it is not a fifth edit in a fifth repository.
    #
    # This replaced a hand-written `unpinned-action` rule in `frontier_lint.py`.
    # zizmor's blanket policy already requires a hash — with no configuration
    # file — and it reads the workflow rather than the line, so it also reports
    # the permission scopes, credential persistence and cache exposure that a
    # regex over `uses:` could never see.
    - name: Frontier GitHub Actions contracts
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        FRONTIER: ${{ inputs.frontier }}
      run: |
        set -euo pipefail
        # zizmor errors rather than passing when collection finds nothing, so a
        # Frontier that runs no Actions at all is skipped here explicitly. Same
        # shape, and same reason, as the source-declaration check below: absent
        # is not the same as failing.
        if [ ! -d "$FRONTIER/.github" ]; then
          echo "no GitHub Actions in this Frontier; nothing to audit"
          exit 0
        fi
        uv run --project "$ACTION_PATH/conformance" --locked \
          zizmor --offline --min-severity medium --no-progress "$FRONTIER"

    - name: Committed source lock matches its declaration
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        FRONTIER: ${{ inputs.frontier }}
      run: |
        set -euo pipefail
        # No declaration, nothing to check. A lock without one is not silently
        # accepted here — the linter's generated-file rule owns that case, and
        # restating it would make two owners that can disagree.
        if [ ! -f "$FRONTIER/sources.yaml" ]; then
          echo "no source declaration in this Frontier; nothing to check"
          exit 0
        fi
        uv run --project "$ACTION_PATH/packages/vela-source-manifest" --locked \
          vela-source-lock --check "$FRONTIER"

    - name: Frontier repository shape
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        FRONTIER: ${{ inputs.frontier }}
      run: |
        set -euo pipefail
        uv run --project "$ACTION_PATH/conformance" --locked \
          python "$ACTION_PATH/conformance/frontier_lint.py" "$FRONTIER"
