[package]
name = "vela-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vela hub: read-only HTTP index over verified Git frontier projections"

[[bin]]
name = "vela-hub"
path = "src/main.rs"

[dependencies]
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
# Re-adds the postgres driver on top of the workspace sqlite-only default.
sqlx = { workspace = true, features = ["postgres"] }
dotenvy.workspace = true
vela-protocol.workspace = true
vela-edge = { path = "../vela-edge" }
# The hosted MCP lane: the hub embeds the serve dispatcher in-process to
# run /mcp over its git-ingest checkouts (no sidecar, one dispatcher).
vela-cli = { path = "../vela-cli" }
async-stream.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono.workspace = true
hex = "0.4"
sha2.workspace = true
hmac.workspace = true

[dev-dependencies]
reqwest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
