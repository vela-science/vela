# This is the release-notice policy input for the cargo-about version pinned in
# .github/release/cargo-about-version. Keep the accepted set aligned with
# deny.toml; cargo deny remains the policy gate while cargo-about harvests the
# corresponding distributable texts.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# One notice bundle covers the union of the two release targets and is staged
# unchanged in both archives. Development-only and build-only crates are not
# linked into the distributed vela executable.
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-musl",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
private = { ignore = true }

# These opt-in cargo-about clarifications are checksum-bound to the packaged
# crate sources and handle known multi-license layouts without a network
# lookup. The release invokes cargo-about with --frozen.
workarounds = ["chrono", "rustix"]
