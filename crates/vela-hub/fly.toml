# Primary fly.io config for the public hub (vela-hub.fly.dev).
# Deploy from the repo root, as documented in docs/HUB.md:
#   flyctl deploy --config crates/vela-hub/fly.toml
# Secondary hubs: fly.hub-2.toml (sjc), fly.hub-eu.toml (ams).

app = "vela-hub"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

# Rolling with BOTH machines always running — measured truth after two
# dark rollouts: fly's bluegreen promotes greens on machine checks, not
# the failing /readyz http check, so unready greens replace blues
# (v0.736: 4 min dark; v0.738: same shape; v0.737's clean run was a
# fast projection build, not the strategy working). Rolling + two warm
# machines + short readyz grace gives the real guarantee: the restarted
# machine fails readyz within 5s, the proxy routes everything to its
# healthy twin for the ~4 min build, then they swap.
[deploy]
  strategy = "rolling"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always warm: the hub is the trust substrate / verifier
  # endpoint, so a cold-start tax on the first request after idle is
  # unacceptable. The second machine still scales to zero.
  # Both machines stay warm: the zero-downtime deploy story requires a
  # healthy twin to route to while the other rebuilds its projection.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

  # Self-healing: poll /healthz so Fly routes traffic away from a wedged
  # machine to the healthy one and restarts the bad one automatically. Without
  # this, a single overloaded machine (e.g. a heavy build hammering Neon) took
  # the whole hub down until a manual restart. grace_period gives a fresh
  # machine time to warm before the first probe.
  [[http_service.checks]]
    interval = "15s"
    timeout = "8s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

  # Readiness: fails until the hosted-MCP projection is built, so a
  # rolling deploy keeps the old machine serving /mcp until the new one
  # is actually ready (~minutes for the first build on a fresh disk).
  # Deploy with `--wait-timeout 600` so flyctl outlasts the build.
  # Grace is SHORT on purpose: the proxy treats in-grace machines as
  # healthy, so a long grace lets not-yet-ready greens absorb traffic
  # during a bluegreen rollout (measured: ~4 min dark on v0.736.0's
  # deploy). Five seconds bounds that window to a blip; the check then
  # fails honestly until the projection is built and bluegreen waits.
  [[http_service.checks]]
    interval = "15s"
    timeout = "8s"
    grace_period = "5s"
    method = "GET"
    path = "/readyz"

[env]
  # Git ingestion (the index re-derives from registered frontier repos).
  # 300s between sweeps; scratch clones live on the machine's ephemeral disk.
  VELA_HUB_GIT_INGEST_INTERVAL_SECS = "300"
  VELA_HUB_GIT_INGEST_DIR = "/tmp/vela-hub-git-ingest"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
