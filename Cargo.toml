[workspace]
# The consolidated Vela workspace:
#   vela-protocol       the protocol kernel (events, reducer, objects)
#   vela-protocol-core  shared primitives under the kernel
#   vela-authority      restricted standard authorization evaluation
#   vela-edge           derived views and adapters over kernel state
#   vela-cli            the `vela` product binary
#   vela-verify         frozen, dependency-light exact verifiers; the
#                       reference registry `vela gate` / `vela reproduce`
#                       build on
members = [
    "crates/vela-protocol",
    "crates/vela-authority",
    "crates/vela-edge",
    "crates/vela-protocol-core",
    "crates/vela-cli",
    "crates/vela-verify",
]
resolver = "3"

[workspace.package]
# Release numbering uses `0.RRR.P`, where RRR names the release train and P is
# the compatible patch within that train. Older `v0.X` markers in comments and
# research documents are historical proof-slice labels.
version = "0.940.2"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/vela-science/vela"
homepage = "https://github.com/vela-science/vela"
# Per-crate `publish` is explicit. Reusable libraries and product binaries are
# publishable; product binaries remain distributed through Vela releases.
publish = false

[workspace.dependencies]
# Shared dependencies
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
# rustls-tls (not the default native-tls) so the tree builds a single
# TLS stack — sqlx already uses rustls — and drops the openssl C build.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
regex = "1"
urlencoding = "2"
colored = "3"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }
# Workspace SQL is sqlite-only and used by replaceable local derived indexes.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
zeroize = "1"
base64 = "0.22"
cedar-policy = { version = "=4.11.2", default-features = false }
unicode-normalization = "0.1"
rand = "0.8"
toml = "0.8"
tempfile = "3"
libc = "0.2"
windows-sys = "0.61"

# Internal crates. `version` is required so cargo publish can resolve
# the dep against crates.io; `path` is used for in-workspace builds.
vela-protocol = { path = "crates/vela-protocol", version = "0.940.2" }
vela-authority = { path = "crates/vela-authority", version = "0.940.2" }
vela-protocol-core = { path = "crates/vela-protocol-core", version = "0.940.2" }
vela-verify = { path = "crates/vela-verify", version = "0.940.2" }
vela-edge = { path = "crates/vela-edge", version = "0.940.2" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Stylistic lints that don't reflect bugs. Tracked for gradual
# cleanup; allowed for now so CI -D warnings is meaningful for the
# lints that do indicate bugs (correctness, suspicious, perf).
doc_lazy_continuation = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
double_must_use = "allow"
empty_line_after_doc_comments = "allow"
cloned_ref_to_slice_refs = "allow"
nonminimal_bool = "allow"
ptr_arg = "allow"
unnecessary_sort_by = "allow"
collapsible_match = "allow"
