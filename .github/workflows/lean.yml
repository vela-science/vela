# Manual build of Vela's Lean model collection against the pinned Lean and
# Mathlib revisions. A successful build means the imported declarations
# elaborate under their stated definitions and assumptions. It does not prove
# equivalence to the Rust implementation, enforce a no-`sorry` policy, or show
# that the models use no custom axioms. See lean/README.md for the exact scope.
name: lean models (manual)

on:
  workflow_dispatch:

concurrency:
  group: lean-models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: install Lean toolchain manager
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: cache pinned dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean/lake-manifest.json', 'lean/lean-toolchain') }}
          restore-keys: lake-${{ runner.os }}-
      - name: fetch pinned Mathlib build cache
        run: lake exe cache get
      - name: elaborate the Vela model collection under declared assumptions
        run: lake build Vela
