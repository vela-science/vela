[project]
name = "vela-conformance"
version = "0.0.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    # Apache-2.0; maintained by Trail of Bits.
    "rfc8785==0.1.4",
    # MIT; JSON Schema 2020-12 validator for the independent wire check.
    "jsonschema==4.26.0",
    # Apache-2.0 OR BSD-3-Clause; Ed25519 for the independent Python emitter.
    "cryptography==50.0.0",
]

[dependency-groups]
dev = [
    # MIT; maintained by Astral.
    "ruff==0.16.4",
    # MIT; maintained by Trail of Bits.
    "zizmor==1.29.0",
]

[tool.ruff]
target-version = "py311"

[tool.uv]
package = false
