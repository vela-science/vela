name: Protocol and Agent helper CI

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "bun.lock"
      - "packages/canopus/tooling/check-authority-boundary.mjs"
      - "packages/protocol/**"
      - "packages/canopus/**"
      - ".github/release/**"
      - ".github/workflows/agent-ci.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "packages/canopus/tooling/check-authority-boundary.mjs"
      - "packages/protocol/**"
      - "packages/canopus/**"
      - ".github/release/**"
      - ".github/workflows/agent-ci.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: .

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
          - runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Load the exact tested toolchain
        shell: bash
        run: node packages/canopus/tooling/export-toolchain-env.mjs "$RUNNER_OS" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/protocol build
      - name: Run platform-appropriate checks
        run: |
          if [ "${{ runner.os }}" = macOS ]; then
            bun run check
          else
            bun run typecheck
            bun run build
            node --test \
              packages/canopus/dist/tests/engine-tools.test.js \
              packages/canopus/dist/tests/agent-attempt.test.js \
              packages/canopus/dist/tests/evidence-manifest-root.test.js \
              packages/canopus/dist/tests/native-custody.test.js
          fi
      - name: Verify released Vela composition
        run: |
          curl --fail --location --silent --show-error \
            "$VELA_URL" \
            --output "$RUNNER_TEMP/$VELA_ARCHIVE"
          printf '%s  %s\n' "$VELA_ARCHIVE_SHA256" "$RUNNER_TEMP/$VELA_ARCHIVE" \
            | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/vela-release"
          if [ "${{ runner.os }}" = macOS ]; then
            unzip -q "$RUNNER_TEMP/$VELA_ARCHIVE" -d "$RUNNER_TEMP/vela-release"
          else
            tar -xzf "$RUNNER_TEMP/$VELA_ARCHIVE" -C "$RUNNER_TEMP/vela-release"
          fi
          printf '%s  %s\n' "$VELA_SHA256" "$RUNNER_TEMP/vela-release/vela" \
            | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/vela-release/vela"
          "$RUNNER_TEMP/vela-release/vela" --version
          if [ "${{ runner.os }}" = macOS ]; then
              VELA_AGENT_VELA_BIN="$RUNNER_TEMP/vela-release/vela" \
              VELA_AGENT_VELA_SHA256="sha256:$VELA_SHA256" \
              VELA_AGENT_VELA_VERSION="$VELA_VERSION" \
              node --test packages/canopus/dist/tests/integration/released-vela.test.js
          fi
      - name: Run real Linux sandbox custody preflight
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles apparmor-utils bubblewrap
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          curl --fail --location --silent --show-error \
            "https://registry.npmjs.org/@openai/codex/-/codex-$CODEX_VERSION-linux-x64.tgz" \
            --output "$RUNNER_TEMP/codex-$CODEX_VERSION-linux-x64.tgz"
          printf '%s  %s\n' "$CODEX_TARBALL_SHA256" \
            "$RUNNER_TEMP/codex-$CODEX_VERSION-linux-x64.tgz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/codex-$CODEX_VERSION-linux-x64"
          tar -xzf "$RUNNER_TEMP/codex-$CODEX_VERSION-linux-x64.tgz" \
            -C "$RUNNER_TEMP/codex-$CODEX_VERSION-linux-x64"
          codex_bin="$RUNNER_TEMP/codex-$CODEX_VERSION-linux-x64/package/vendor/x86_64-unknown-linux-musl/bin/codex"
          printf '%s  %s\n' "$CODEX_BINARY_SHA256" "$codex_bin" | shasum -a 256 -c -
          chmod +x "$codex_bin"
          test "$("$codex_bin" --version)" = "codex-cli $CODEX_VERSION"
          node packages/canopus/tooling/run-native-sandbox-preflight.mjs --codex "$codex_bin"
      - name: Pull frozen verifier anonymously by exact digest
        if: runner.os == 'Linux'
        env:
          VERIFIER_IMAGE: ghcr.io/vela-science/canopus-verifier@sha256:a6f354862f2a3f7d72eb99244c65fa8583c98b74e17e3d5ce6e31ef48aa16536
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker-config"
          mkdir "$DOCKER_CONFIG"
          docker pull "$VERIFIER_IMAGE"
          docker image inspect --format '{{json .RepoDigests}}' "$VERIFIER_IMAGE" \
            | grep -F 'ghcr.io/vela-science/canopus-verifier@sha256:a6f354862f2a3f7d72eb99244c65fa8583c98b74e17e3d5ce6e31ef48aa16536'
      - name: Validate the packed Protocol package
        run: |
          mkdir "$RUNNER_TEMP/product-packages"
          bun pm pack --cwd packages/protocol --destination "$RUNNER_TEMP/product-packages"
          set -- "$RUNNER_TEMP"/product-packages/vela-science-protocol-*.tgz
          test "$#" -eq 1
          protocol="$1"
          node .github/release/publish-protocol.mjs check "$protocol"

  windows-read-only:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Load the exact tested toolchain
        shell: pwsh
        run: node packages/canopus/tooling/export-toolchain-env.mjs "$env:RUNNER_OS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/protocol build
      - run: bun run --cwd packages/canopus typecheck
      - run: bun run --cwd packages/canopus build
      - name: Verify native Windows platform contracts
        run: node --test packages/canopus/dist/tests/product-platform.test.js
      - name: Verify Vela and the packed Protocol package
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\vela-windows-x86_64.zip"
          Invoke-WebRequest `
            -Uri $env:VELA_URL `
            -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne `
              $env:VELA_ARCHIVE_SHA256) {
            throw "Vela archive checksum mismatch"
          }
          Expand-Archive $archive "$env:RUNNER_TEMP\vela"
          if ((Get-FileHash "$env:RUNNER_TEMP\vela\vela.exe" -Algorithm SHA256).Hash.ToLower() -ne `
              $env:VELA_SHA256) {
            throw "Vela binary checksum mismatch"
          }
          & "$env:RUNNER_TEMP\vela\vela.exe" --version
          bun pm pack --cwd packages/protocol --destination $env:RUNNER_TEMP
          $protocol = Get-ChildItem "$env:RUNNER_TEMP\vela-science-protocol-*.tgz" |
            Select-Object -First 1
          node .github/release/publish-protocol.mjs check $protocol.FullName
