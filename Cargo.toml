[workspace]
# The consolidated Vela workspace:
#   vela-protocol       current object, root, event, and authority contracts
#   vela-authority      restricted standard authorization evaluation
#   vela-edge           derived views and adapters over kernel state
#   vela-cli            the `vela` product binary
#   vela-verify         frozen, dependency-light exact verifiers; the
#                       reference registry `vela reproduce` builds on
members = [
    "crates/vela-protocol",
    "crates/vela-authority",
    "crates/vela-edge",
    "crates/vela-cli",
    "crates/vela-verify",
]
resolver = "3"

[workspace.package]
# Release numbering uses `0.RRR.P`, where RRR names the release train and P is
# the compatible patch within that train. Older `v0.X` markers in comments and
# research documents are historical proof-slice labels.
version = "0.969.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/vela-science/vela"
homepage = "https://github.com/vela-science/vela"
# Workspace crates are implementation boundaries, not separate products.
# GitHub Releases distribute the single `vela` binary.
publish = false

[workspace.dependencies]
# Shared dependencies
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "=0.3.2"
# The wire JSON Schemas in `schemas/` are generated from the object types, not
# written alongside them. See `crates/vela-protocol/src/wire_schema.rs`.
schemars = "1"
toml = "1.1.4"
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
chrono = "0.4"
hex = "0.4"
colored = "3"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
base64 = "0.22"
ssh-key = { version = "0.6", default-features = false, features = ["std"] }
ssh-encoding = { version = "0.2", features = ["std"] }
cedar-policy = { version = "=4.11.2", default-features = false }
unicode-normalization = "0.1"
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile = "3"
regex = "1"
libc = "0.2"

# Internal crates share one release identity and are not published separately.
# No `version` key here: these are path-only and `publish = false`, so a req
# would be a second copy of `[workspace.package] version` to keep in step. It
# was already out of step; the workspace moved to 0.966.3 and these four keys
# stayed at 0.966.2.
vela-protocol = { path = "crates/vela-protocol" }
vela-authority = { path = "crates/vela-authority" }
vela-verify = { path = "crates/vela-verify" }
vela-edge = { path = "crates/vela-edge" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Stylistic lints that don't reflect bugs. Tracked for gradual
# cleanup; allowed for now so CI -D warnings is meaningful for the
# lints that do indicate bugs (correctness, suspicious, perf).
doc_lazy_continuation = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
double_must_use = "allow"
empty_line_after_doc_comments = "allow"
cloned_ref_to_slice_refs = "allow"
nonminimal_bool = "allow"
ptr_arg = "allow"
unnecessary_sort_by = "allow"
collapsible_match = "allow"
