[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[advisories]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = [
  { crate = "getrandom@0.4.2", reason = "tempfile has moved to getrandom 0.4 while rand and Ed25519 still require 0.2" },
  { crate = "syn@3.0.3", reason = "Cedar's ref-cast path uses syn 3 while the remaining proc macros use syn 2" },
  { crate = "unicode-width@0.2.2", reason = "Cedar's formatter currently composes miette and pretty across the 0.1/0.2 transition" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
